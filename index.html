<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>BLEDOM Controller</title>
		<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet" />
		<style>
			body {
				font-family: 'Roboto', sans-serif;
				text-align: center;
				margin: 20px;
			}
			button {
				padding: 10px 20px;
				font-size: 16px;
				background-color: #4CAF50;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
			}
			button:disabled {
				background-color: #cccccc;
			}
			#powerBtn.off {
				background-color: #f44336;
			}
		</style>
	</head>
	<body>
		<div id="nosupport" style="display: none;">
			<h1>Bluetooth is not enabled or supported by your web browser</h1>
			<p>To enable the (experimental) Bluetooth capabilities of your web browser, go to <a href="chrome://flags" target="_blank">chrome://flags</a> and enable the <i>#experimental-web-platform-features</i> flag. Then restart your browser.</p>
		</div>
		<div id="yesyes" style="display: none;">
			<h1>BLEDOM Controller</h1>
			<button id="searchBtn" onclick="searchBLEDom()">Connect</button>
			<div id="controls" style="display: none;">
				<button id="powerBtn" class="off" onclick="togglePower()">Turn On</button>
			</div>
		</div>
		<noscript>
			<h1>Javascript is required for this webpage to work.</h1>
			<p>Please enable Javascript in your browser, then reload the page.</p>
		</noscript>
		<script>
			let device = null;
			let powerState = false;
			
			// Check for Bluetooth support
			window.addEventListener('load', function() {
				if (!navigator.bluetooth) {
					document.getElementById('nosupport').style.display = 'block';
					document.getElementById('yesyes').style.display = 'none';
				} else {
					document.getElementById('nosupport').style.display = 'none';
					document.getElementById('yesyes').style.display = 'block';
				}
			});
			
			async function searchBLEDom() {
				try {
					device = await navigator.bluetooth.requestDevice({
						acceptAllDevices: true,
						optionalServices: ['0000ffe5-0000-1000-8000-00805f9a34fb']
					});
					
					const server = await device.gatt.connect();
					document.getElementById('searchBtn').disabled = true;
					document.getElementById('controls').style.display = 'block';
				} catch(error) {
					console.error('Error:', error);
					alert('Connection failed: ' + error.message);
				}
			}
			
			async function togglePower() {
				if (!device) return;
				
				try {
					const server = await device.gatt.connect();
					const service = await server.getPrimaryService('0000ffe5-0000-1000-8000-00805f9a34fb');
					const characteristic = await service.getCharacteristic('0000ffe9-0000-1000-8000-00805f9a34fb');
					
					powerState = !powerState;
					const command = powerState ? new Uint8Array([0x7E, 0x00, 0x04, 0x01, 0x00, 0x00, 0x00, 0xEF]) 
											  : new Uint8Array([0x7E, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEF]);
					
					await characteristic.writeValue(command);
					
					const powerBtn = document.getElementById('powerBtn');
					powerBtn.textContent = powerState ? 'Turn Off' : 'Turn On';
					powerBtn.className = powerState ? '' : 'off';
				} catch(error) {
					console.error('Error:', error);
					alert('Operation failed: ' + error.message);
				}
			}
		</script>
	</body>
</html>
