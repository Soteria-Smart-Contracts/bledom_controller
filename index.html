<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM</title>
    <style>
        body{background:#0a192f;color:#e6f1ff;font-family:sans-serif;text-align:center;margin:20px;}
        #color-triangle{width:400px;height:346px;margin:10px auto;position:relative;clip-path:polygon(50% 0,100% 100%,0 100%);background:conic-gradient(red 0deg, yellow 60deg, lime 120deg, cyan 180deg, blue 240deg, magenta 300deg, red 360deg);}
        #brightness{width:400px;margin:10px auto;accent-color:#3b82f6;}
        button{padding:12px 24px;font-size:16px;border:none;border-radius:6px;cursor:pointer;margin:5px;}
        #connectBtn{background:#3b82f6;color:white;}
        #powerBtn{background:#444;color:white;}
        #powerBtn.on{background:#3b82f6;box-shadow:0 0 15px #3b82f6;}
    </style>
</head>
<body>
    <div id="nosupport" style="display:none"><h1>No Bluetooth</h1><p>Enable in chrome://flags</p></div>
    <div id="interface" style="display:none">
        <h1>BLEDOM</h1>
        <div id="status">Click Connect</div>
        <button id="connectBtn" onclick="hc()">Connect</button>
        <div id="controls" style="display:none">
            <button id="powerBtn" onmouseover="hoverPower()" onmouseout="unhoverPower()" onclick="togglePower()">Power Off</button>
            <div id="color-triangle" onmousemove="setColorFromPos(event)" onclick="lockColor()"></div>
            <input type="range" id="brightness" min="0" max="100" value="100" oninput="setB(this.value)" onchange="setB(this.value)">
        </div>
    </div>

<script>
let d=null,c=null,clr={r:255,g:255,b:255},pwr=1,colorLocked=false;
window.onload=()=>{
    if(!navigator.bluetooth)document.getElementById('nosupport').style.display='block';
    else document.getElementById('interface').style.display='block';
};

async function hc(){
    try{
        if(d&&d.gatt.connected)return;
        d=await navigator.bluetooth.requestDevice({
            acceptAllDevices:true,
            optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']
        });
        d.addEventListener('gattserverdisconnected',()=>{
            document.getElementById('connectBtn').style.display='block';
            document.getElementById('controls').style.display='none';
        });
        const s=await d.gatt.connect(),v=await s.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
        c=await v.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
        document.getElementById('connectBtn').style.display='none';
        document.getElementById('controls').style.display='block';
    }catch(e){document.getElementById('status').textContent=`Error: ${e}`;}
}

function sc(cmd){return c?c.writeValue(cmd):Promise.reject();}
function setC(r,g,b){clr={r,g,b};return sc(new Uint8Array([0x7e,0,5,3,r,g,b,0,0xef]));}
function setB(v){return sc(new Uint8Array([0x7e,0,1,v,0,0,0,0,0xef]));}

function setColorFromPos(e){
    if(colorLocked) return;
    const t=e.target.getBoundingClientRect();
    const x=e.clientX-t.left,y=e.clientY-t.top;
    const h=Math.atan2(y-346,x-200)*180/Math.PI+180;
    const s=Math.min(1,y/346*2);
    const rgb=hsvToRgb(h/360,s,1);
    setC(rgb.r,rgb.g,rgb.b);
}

function lockColor(){colorLocked=!colorLocked;}

function hsvToRgb(h,s,v){
    let r,g,b,i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
    switch(i%6){
        case 0:r=v,g=t,b=p;break;
        case 1:r=q,g=v,b=p;break;
        case 2:r=p,g=v,b=t;break;
        case 3:r=p,g=q,b=v;break;
        case 4:r=t,g=p,b=v;break;
        case 5:r=v,g=p,b=q;break;
    }
    return{r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};
}

function hoverPower(){if(pwr)sc(new Uint8Array([0x7e,0,4,0,0,0,0,0xef]));}
function unhoverPower(){if(pwr)sc(new Uint8Array([0x7e,0,4,1,0,0,0,0xef])).then(()=>setC(clr.r,clr.g,clr.b));}
function togglePower(){
    pwr=!pwr;
    const p=document.getElementById('powerBtn');
    p.textContent=pwr?'Power Off':'Power On';
    p.classList.toggle('on');
    sc(new Uint8Array([0x7e,0,4,pwr?1:0,0,0,0,0xef])).then(()=>pwr&&setC(clr.r,clr.g,clr.b));
}
</script>
</body>
</html>
