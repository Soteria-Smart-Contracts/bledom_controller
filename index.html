<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM Controller</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --accent: #3b82f6;
            --text: #e6f1ff;
        }
        body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: sans-serif;
            text-align: center;
            margin: 20px;
        }
        #color-picker {
            width: 200px;
            height: 200px;
            background: linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red);
            border-radius: 10px;
            margin: 20px auto;
            cursor: crosshair;
        }
        #brightness {
            width: 200px;
            margin: 20px auto;
            accent-color: var(--accent);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        #connectBtn { background: var(--accent); color: white; }
        #powerBtn { background: #444; color: white; }
        #powerBtn.on { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        #status { margin: 15px 0; min-height: 20px; }
    </style>
</head>
<body>
    <div id="nosupport" style="display: none;">
        <h1>Bluetooth not supported</h1>
        <p>Enable experimental web features in chrome://flags</p>
    </div>

    <div id="interface" style="display: none;">
        <h1>BLEDOM Controller</h1>
        <div id="status">Click Connect to pair device</div>
        <button id="connectBtn" onclick="handleConnect()">Connect</button>
        <div id="controls" style="display: none;">
            <div id="color-picker"></div>
            <input type="range" id="brightness" min="0" max="100" value="100">
            <button id="powerBtn" onclick="togglePower()">Power Off</button>
        </div>
    </div>

    <script>
        let device = null;
        let characteristic = null;
        let currentColor = { r: 255, g: 255, b: 255 };

        // Browser storage keys
        const STORAGE_KEYS = {
            DEVICE_ID: 'bledom_device_id',
            DEVICE_NAME: 'bledom_device_name'
        };

        // Initialize
        window.addEventListener('load', () => {
            if (!navigator.bluetooth) {
                document.getElementById('nosupport').style.display = 'block';
                return;
            }
            document.getElementById('interface').style.display = 'block';
            checkSavedDevice();
        });

        async function handleConnect() {
            try {
                const savedDeviceId = localStorage.getItem(STORAGE_KEYS.DEVICE_ID);
                if (savedDeviceId) {
                    await reconnectToDevice(savedDeviceId);
                } else {
                    await pairNewDevice();
                }
            } catch (error) {
                console.error('Connection failed:', error);
                updateStatus(`Error: ${error.message}`, true);
            }
        }

        async function reconnectToDevice(deviceId) {
            updateStatus('Trying to reconnect...');
            try {
                device = await navigator.bluetooth.requestDevice({
                    deviceId: deviceId,
                    optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
                });
                await completeConnection();
                updateStatus(`Reconnected to ${device.name || 'device'}`);
            } catch (error) {
                console.log('Reconnection failed, starting new pairing');
                await pairNewDevice();
            }
        }

        async function pairNewDevice() {
            updateStatus('Select your device from the list...');
            device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
            });
            
            // Store device identifier
            localStorage.setItem(STORAGE_KEYS.DEVICE_ID, device.id);
            localStorage.setItem(STORAGE_KEYS.DEVICE_NAME, device.name);
            
            await completeConnection();
            updateStatus(`Connected to ${device.name || 'device'}`);
        }

        async function completeConnection() {
            device.addEventListener('gattserverdisconnected', onDisconnected);
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
            characteristic = await service.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
            
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('powerBtn').classList.add('on');
        }

        function onDisconnected() {
            updateStatus('Disconnected. Click Connect to reconnect.', true);
            device = null;
            characteristic = null;
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('controls').style.display = 'none';
        }

        function checkSavedDevice() {
            const deviceName = localStorage.getItem(STORAGE_KEYS.DEVICE_NAME);
            if (deviceName) {
                updateStatus(`Paired device: ${deviceName}`);
            }
        }

        function updateStatus(message, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#ff4444' : 'inherit';
        }

        // Device control functions
        function sendCommand(command) {
            if (!characteristic) return Promise.reject('Not connected');
            return characteristic.writeValue(command);
        }

        function setColor(r, g, b) {
            currentColor = { r, g, b };
            const command = new Uint8Array([0x7e, 0x00, 0x05, 0x03, r, g, b, 0x00, 0xef]);
            return sendCommand(command);
        }

        function setBrightness(value) {
            const command = new Uint8Array([0x7e, 0x00, 0x01, value, 0x00, 0x00, 0x00, 0x00, 0xef]);
            return sendCommand(command);
        }

        function togglePower() {
            const powerBtn = document.getElementById('powerBtn');
            const isOn = powerBtn.classList.contains('on');
            const command = new Uint8Array([0x7e, 0x00, 0x04, isOn ? 0x00 : 0x01, 0x00, 0x00, 0x00, 0xef]);
            
            sendCommand(command).then(() => {
                powerBtn.textContent = isOn ? 'Power On' : 'Power Off';
                powerBtn.classList.toggle('on');
                if (!isOn) setColor(currentColor.r, currentColor.g, currentColor.b);
            });
        }

        // Color picker implementation
        document.getElementById('color-picker').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            
            const hue = x * 360;
            const saturation = 1 - y;
            currentColor = hsvToRgb(hue, saturation, 1);
            
            setColor(currentColor.r, currentColor.g, currentColor.b);
        });

        document.getElementById('brightness').addEventListener('input', (e) => {
            setBrightness(parseInt(e.target.value));
        });

        function hsvToRgb(h, s, v) {
            let r, g, b, i = Math.floor(h/60), f = h/60 - i;
            let p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
            switch(i%6) {
                case 0: r=v, g=t, b=p; break;
                case 1: r=q, g=v, b=p; break;
                case 2: r=p, g=v, b=t; break;
                case 3: r=p, g=q, b=v; break;
                case 4: r=t, g=p, b=v; break;
                case 5: r=v, g=p, b=q; break;
            }
            return {
                r: Math.round(r*255),
                g: Math.round(g*255),
                b: Math.round(b*255)
            };
        }
    </script>
</body>
</html>
