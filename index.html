<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM Controller</title>
    <style>
        body {
            background: #0a192f;
            color: #e6f1ff;
            font-family: sans-serif;
            text-align: center;
            margin: 20px;
        }
        #color-container {
            width: 400px;
            height: 346px;
            margin: 20px auto;
            position: relative;
        }
        #color-triangle {
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            background: conic-gradient(red 0deg, #ff0 60deg, lime 120deg, cyan 180deg, blue 240deg, magenta 300deg, red 360deg);
            cursor: crosshair;
        }
        #magnifier {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #brightness {
            width: 400px;
            margin: 20px auto;
            accent-color: #3b82f6;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        #connectBtn { background: #3b82f6; color: white; }
        #powerBtn { background: #444; color: white; }
        #powerBtn.on { background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        #previewToggle { background: #555; color: white; }
        #previewToggle.on { background: #3b82f6; }
    </style>
</head>
<body>
    <div id="nosupport" style="display: none">
        <h1>Bluetooth Not Supported</h1>
        <p>Enable experimental web features in chrome://flags</p>
    </div>
    <div id="interface" style="display: none">
        <h1>BLEDOM Controller</h1>
        <div id="status">Click Connect to pair device</div>
        <button id="connectBtn" onclick="handleConnect()">Connect</button>
        <div id="controls" style="display: none">
            <div>
                <button id="powerBtn" onmouseover="handlePowerHover(true)" onmouseout="handlePowerHover(false)" onclick="togglePower()">Power Off</button>
                <button id="previewToggle" onclick="togglePreview()">Preview: ON</button>
            </div>
            <div id="color-container">
                <div id="color-triangle" onmousemove="handleColorHover(event)" onclick="selectColor(event)" onmouseout="hideMagnifier()"></div>
                <div id="magnifier"></div>
            </div>
            <input type="range" id="brightness" min="0" max="100" value="100" oninput="handleBrightnessChange(event)">
        </div>
    </div>

<script>
let device = null, characteristic = null, currentColor = { r: 255, g: 255, b: 255 };
let isPoweredOn = true, isHoveringPower = false, previewEnabled = true, colorSelectCooldown = false;

// Initialize
window.addEventListener('load', () => {
    if (!navigator.bluetooth) document.getElementById('nosupport').style.display = 'block';
    else document.getElementById('interface').style.display = 'block';
});

// Connection handling
async function handleConnect() {
    try {
        device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ['0000fff0-0000-1000-8000-00805f9b34fb']
        });
        
        device.addEventListener('gattserverdisconnected', () => {
            document.getElementById('connectBtn').style.display = 'block';
            document.getElementById('controls').style.display = 'none';
        });
        
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
        characteristic = await service.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
        
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
    } catch (error) {
        document.getElementById('status').textContent = `Error: ${error.message}`;
    }
}

// Color handling with magnifier
function handleColorHover(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    
    // Show magnifier at cursor position
    const mag = document.getElementById('magnifier');
    mag.style.display = 'block';
    mag.style.left = (event.clientX - 20) + 'px';
    mag.style.top = (event.clientY - 20) + 'px';
    
    // Get exact pixel color
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.canvas.width = rect.width;
    ctx.canvas.height = rect.height;
    const style = window.getComputedStyle(event.target);
    ctx.fillStyle = style.background;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    
    // Update magnifier with exact color
    const rgb = { r: pixel[0], g: pixel[1], b: pixel[2] };
    mag.style.background = `rgb(${rgb.r},${rgb.g},${rgb.b})`;
    
    // Send color if preview is enabled and not in cooldown
    if (previewEnabled && !colorSelectCooldown && isPoweredOn) {
        sendColorCommand(rgb);
    }
}

function hideMagnifier() {
    document.getElementById('magnifier').style.display = 'none';
}

function selectColor(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    
    // Get exact pixel color
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.canvas.width = rect.width;
    ctx.canvas.height = rect.height;
    const style = window.getComputedStyle(event.target);
    ctx.fillStyle = style.background;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const pixel = ctx.getImageData(x, y, 1, 1).data;
    
    currentColor = { r: pixel[0], g: pixel[1], b: pixel[2] };
    sendColorCommand(currentColor);
    
    // Start 5-second cooldown
    colorSelectCooldown = true;
    setTimeout(() => colorSelectCooldown = false, 5000);
}

// Preview toggle
function togglePreview() {
    previewEnabled = !previewEnabled;
    const btn = document.getElementById('previewToggle');
    btn.textContent = `Preview: ${previewEnabled ? 'ON' : 'OFF'}`;
    btn.classList.toggle('on');
}

// Device commands
function sendColorCommand(color) {
    if (!characteristic) return;
    const command = new Uint8Array([0x7e, 0x00, 0x05, 0x03, 
                                  color.r, color.g, color.b, 0x00, 0xef]);
    characteristic.writeValue(command);
}

function handleBrightnessChange(event) {
    if (!characteristic || !isPoweredOn) return;
    const command = new Uint8Array([0x7e, 0x00, 0x01, 
                                  parseInt(event.target.value), 
                                  0x00, 0x00, 0x00, 0x00, 0xef]);
    characteristic.writeValue(command);
}

// Power management
function handlePowerHover(hovering) {
    isHoveringPower = hovering;
    if (!characteristic) return;
    const command = new Uint8Array([0x7e, 0x00, 0x04, 
                                   hovering ? 0x00 : (isPoweredOn ? 0x01 : 0x00), 
                                   0x00, 0x00, 0x00, 0xef]);
    characteristic.writeValue(command);
}

function togglePower() {
    isPoweredOn = !isPoweredOn;
    const powerBtn = document.getElementById('powerBtn');
    powerBtn.textContent = isPoweredOn ? 'Power Off' : 'Power On';
    powerBtn.classList.toggle('on');
    const command = new Uint8Array([0x7e, 0x00, 0x04, 
                                  isPoweredOn ? 0x01 : 0x00, 
                                  0x00, 0x00, 0x00, 0xef]);
    characteristic.writeValue(command);
    if (isPoweredOn) sendColorCommand(currentColor);
}
</script>
</body>
</html>
