<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM Controller</title>
    <style>
        body{background:#0a192f;color:#e6f1ff;font-family:sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;}
        #color-rect{width:600px;height:300px;background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,1)), linear-gradient(to right,red,yellow,lime,cyan,blue,magenta,red);cursor:crosshair;margin:20px 0;position:relative;}
        .preset-row{display:flex;justify-content:center;width:100%;margin-bottom:10px;}
        .preset{width:180px;height:50px;margin:5px;cursor:pointer;border:2px solid #444;border-radius:6px;position:relative;}
        .preset.editing{border:2px solid orange;}
        .edit-icon{position:absolute;left:5px;top:5px;width:20px;height:20px;background:#444;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;cursor:pointer;z-index:2;}
        .edit-icon:hover{background:#3b82f6;}
        button{padding:12px 24px;font-size:16px;border:none;border-radius:6px;cursor:pointer;margin:5px;transition:all 0.3s;}
        #connectBtn{background:#3b82f6;color:white;}
        .control-group{display:flex;justify-content:center;align-items:center;gap:10px;}
        #powerBtn,#previewBtn{min-width:120px;background:#444;color:white;transition:all 0.3s ease;}
        #powerBtn.on,#previewBtn.on{background:#3b82f6;box-shadow:0 0 15px #3b82f6;}
        #powerBtn:hover,#previewBtn:hover{transform:scale(1.05);box-shadow:0 0 10px rgba(59,130,246,0.5);}
        #powerBtn.hover-effect,#previewBtn.hover-effect{background:#3b82f6;box-shadow:0 0 15px #3b82f6;}
    </style>
</head>
<body>
    <div id="nosupport" style="display:none"><h1>No Bluetooth</h1><p>Enable in chrome://flags</p></div>
    <div id="interface" style="display:none;text-align:center">
        <h1>BLEDOM Controller</h1>
        <button id="connectBtn" onclick="hc()">Connect</button>
        <div id="controls" style="display:none">
            <div class="control-group">
                <button id="powerBtn" onmouseover="hoverPower()" onmouseout="unhoverPower()" onclick="lockPower()">Power Off</button>
                <button id="previewBtn" class="on" onclick="togglePreview()">Preview: ON</button>
            </div>
            <div id="color-rect" onmousemove="throttlePreview(event)" onclick="lockColor(event)"></div>
            <div class="preset-row">
                <div class="preset" id="preset1">
                    <div class="edit-icon" onclick="toggleEditPreset(1)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(1)"></div>
                </div>
                <div class="preset" id="preset2">
                    <div class="edit-icon" onclick="toggleEditPreset(2)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(2)"></div>
                </div>
                <div class="preset" id="preset3">
                    <div class="edit-icon" onclick="toggleEditPreset(3)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(3)"></div>
                </div>
            </div>
            <div class="preset-row">
                <div class="preset" id="preset4">
                    <div class="edit-icon" onclick="toggleEditPreset(4)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(4)"></div>
                </div>
                <div class="preset" id="preset5">
                    <div class="edit-icon" onclick="toggleEditPreset(5)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(5)"></div>
                </div>
                <div class="preset" id="preset6">
                    <div class="edit-icon" onclick="toggleEditPreset(6)">✎</div>
                    <div class="preset-content" onclick="handlePresetClick(6)"></div>
                </div>
            </div>
        </div>
    </div>

<script>
let d,c,clr={r:255,g:0,b:0},pwr=1,preview=1,cooldown=0,isConnected=0,lastColorTime=0;
let presets = JSON.parse(localStorage.getItem('bledomPresets')) || [
    {r:0,g:0,b:0,brightness:50},
    {r:0,g:0,b:0,brightness:50},
    {r:0,g:0,b:0,brightness:50},
    {r:0,g:0,b:0,brightness:50},
    {r:0,g:0,b:0,brightness:50},
    {r:0,g:0,b:0,brightness:50}
];
let editingPreset = null;

const sc=cmd=>c?.writeValue(cmd)??Promise.reject();
const setC=(r,g,b)=>{clr={r,g,b};return sc(new Uint8Array([0x7e,0,5,3,r,g,b,0,0xef]));};
const setB=v=>sc(new Uint8Array([0x7e,0,1,v,0,0,0,0,0xef]));

window.onload=()=>{
    document.getElementById(navigator.bluetooth?'interface':'nosupport').style.display='block';
    updatePresetDisplays();
};

function savePresets() {
    localStorage.setItem('bledomPresets', JSON.stringify(presets));
}

async function hc(){
    try{
        d=await navigator.bluetooth.requestDevice({
            acceptAllDevices:true,
            optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']
        });
        d.addEventListener('gattserverdisconnected',()=>{
            document.getElementById('connectBtn').style.display='block';
            document.getElementById('controls').style.display='none';
            isConnected=0;
        });
        const s=await d.gatt.connect();
        const v=await s.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
        c=await v.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
        document.getElementById('connectBtn').style.display='none';
        document.getElementById('controls').style.display='block';
        isConnected=1;
        // Auto-on with current color when interacting
        pwr = 1;
        document.getElementById('powerBtn').textContent='Power Off';
        document.getElementById('powerBtn').classList.add('on');
        await sc(new Uint8Array([0x7e,0,4,1,0,0,0,0xef]));
    }catch(e){console.error('Connection error:',e);alert('Connection error: '+e.message);}
}

function throttlePreview(e){
    const now=Date.now();
    if(!preview||cooldown||!pwr||now-lastColorTime<100)return;
    lastColorTime=now;
    const rect=e.target.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width;
    const y=(e.clientY-rect.top)/rect.height;
    const brightness = Math.round(100 - (y * 100));
    const rgb=hsvToRgb(x*360,1,1);
    setC(rgb.r,rgb.g,rgb.b);
    setB(brightness);
    
    // If in edit mode, update the preset preview
    if(editingPreset) {
        presets[editingPreset-1] = {r:rgb.r, g:rgb.g, b:rgb.b, brightness};
        updatePresetDisplays();
    }
}

function lockColor(e){
    const rect=e.target.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width;
    const y=(e.clientY-rect.top)/rect.height;
    const brightness = Math.round(100 - (y * 100));
    const rgb=hsvToRgb(x*360,1,1);
    setC(rgb.r,rgb.g,rgb.b);
    setB(brightness);
    
    if(editingPreset) {
        presets[editingPreset-1] = {r:rgb.r, g:rgb.g, b:rgb.b, brightness};
        document.getElementById(`preset${editingPreset}`).classList.remove('editing');
        editingPreset = null;
        savePresets();
    }
    cooldown=1;
    setTimeout(()=>cooldown=0,5000);
}

function handlePresetClick(num) {
    if(editingPreset === num) return;
    applyPreset(num-1);
}

function toggleEditPreset(num) {
    if(editingPreset === num) {
        document.getElementById(`preset${num}`).classList.remove('editing');
        editingPreset = null;
    } else {
        if(editingPreset) {
            document.getElementById(`preset${editingPreset}`).classList.remove('editing');
        }
        editingPreset = num;
        document.getElementById(`preset${num}`).classList.add('editing');
        // Set current color to the preset being edited
        const preset = presets[num-1];
        setC(preset.r, preset.g, preset.b);
        setB(preset.brightness);
    }
}

function applyPreset(index) {
    const preset = presets[index];
    // Auto turn on lights when applying preset
    pwr = 1;
    document.getElementById('powerBtn').textContent='Power Off';
    document.getElementById('powerBtn').classList.add('on');
    sc(new Uint8Array([0x7e,0,4,1,0,0,0,0xef])).then(()=>{
        setC(preset.r, preset.g, preset.b);
        setB(preset.brightness);
        clr = {r: preset.r, g: preset.g, b: preset.b};
    });
}

function updatePresetDisplays() {
    presets.forEach((preset, i) => {
        const el = document.getElementById(`preset${i+1}`).querySelector('.preset-content');
        el.style.background = `rgb(${preset.r},${preset.g},${preset.b})`;
        el.title = `Color: ${Math.round(preset.r)},${Math.round(preset.g)},${Math.round(preset.b)} | Brightness: ${preset.brightness}%`;
    });
}

function hoverPower(){
    if(!isConnected)return;
    const btn=document.getElementById('powerBtn');
    btn.classList.add('hover-effect');
    sc(new Uint8Array([0x7e,0,4,pwr?0:1,0,0,0,0xef]));
}

function unhoverPower(){
    if(!isConnected)return;
    const btn=document.getElementById('powerBtn');
    btn.classList.remove('hover-effect');
    sc(new Uint8Array([0x7e,0,4,pwr?1:0,0,0,0,0xef]));
}

function lockPower(){
    if(!isConnected)return;
    pwr=!pwr;
    const p=document.getElementById('powerBtn');
    p.textContent=pwr?'Power Off':'Power On';
    p.classList.toggle('on');
    sc(new Uint8Array([0x7e,0,4,pwr?1:0,0,0,0,0xef])).then(()=>pwr&&setC(clr.r,clr.g,clr.b));
}

function togglePreview(){
    preview=!preview;
    const p=document.getElementById('previewBtn');
    p.textContent=`Preview: ${preview?'ON':'OFF'}`;
    p.classList.toggle('on');
}

function hsvToRgb(h,s,v){
    h/=60;let i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
    switch(i%6){
        case 0:return{r:v*255,g:t*255,b:p*255};
        case 1:return{r:q*255,g:v*255,b:p*255};
        case 2:return{r:p*255,g:v*255,b:t*255};
        case 3:return{r:p*255,g:q*255,b:v*255};
        case 4:return{r:t*255,g:p*255,b:v*255};
        default:return{r:v*255,g:p*255,b:q*255};
    }
}
</script>
</body>
</html>
