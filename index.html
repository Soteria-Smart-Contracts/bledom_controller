<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM Controller</title>
    <style>
        :root { --bg-dark: #0a192f; --accent: #3b82f6; --text: #e6f1ff; }
        body { background: var(--bg-dark); color: var(--text); font-family: sans-serif; text-align: center; margin: 20px; }
        #color-triangle { width: 200px; height: 173px; margin: 20px auto; position: relative; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
        #color-triangle div { position: absolute; width: 100%; height: 100%; mix-blend-mode: screen; }
        #brightness { width: 200px; margin: 20px auto; accent-color: var(--accent); }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        #connectBtn { background: var(--accent); color: white; }
        #powerBtn { background: #444; color: white; }
        #powerBtn.on { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
        #status { margin: 15px 0; min-height: 20px; }
    </style>
</head>
<body>
    <div id="nosupport" style="display:none"><h1>Bluetooth not supported</h1><p>Enable experimental web features in chrome://flags</p></div>
    <div id="interface" style="display:none">
        <h1>BLEDOM Controller</h1>
        <div id="status">Click Connect to pair device</div>
        <button id="connectBtn" onclick="handleConnect()">Connect</button>
        <div id="controls" style="display:none">
            <div id="color-triangle"><div style="background:red"></div><div style="background:lime"></div><div style="background:blue"></div></div>
            <input type="range" id="brightness" min="0" max="100" value="100">
            <button id="powerBtn" onclick="togglePower()">Power Off</button>
        </div>
    </div>

<script>
let d=null,c=null,color={r:255,g:255,b:255},STORAGE={ID:'bledom_id',NAME:'bledom_name'};
window.addEventListener('load',()=>{
    if(!navigator.bluetooth) document.getElementById('nosupport').style.display='block';
    else document.getElementById('interface').style.display='block';
    if(localStorage.getItem(STORAGE.NAME)) updateStatus(`Saved device: ${localStorage.getItem(STORAGE.NAME)}`);
});

async function handleConnect(){
    try{
        const id=localStorage.getItem(STORAGE.ID);
        if(id){
            updateStatus('Reconnecting...');
            const devices=await navigator.bluetooth.getDevices(),saved=devices.find(d=>d.id===id);
            if(saved&&saved.gatt){d=saved;await connect();return;}
            d=await navigator.bluetooth.requestDevice({deviceId:id,optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']});
            await connect();
        }else{
            updateStatus('Select device...');
            d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']});
            localStorage.setItem(STORAGE.ID,d.id);
            localStorage.setItem(STORAGE.NAME,d.name||'Unknown Device');
            await connect();
        }
    }catch(e){updateStatus(`Error: ${e.message}`,1);}
}

async function connect(){
    d.addEventListener('gattserverdisconnected',()=>{
        updateStatus('Disconnected. Click Connect.',1);
        d=null;c=null;
        document.getElementById('connectBtn').style.display='block';
        document.getElementById('controls').style.display='none';
    });
    const s=await d.gatt.connect(),v=await s.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
    c=await v.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
    document.getElementById('connectBtn').style.display='none';
    document.getElementById('controls').style.display='block';
    document.getElementById('powerBtn').classList.add('on');
    updateStatus(`Connected to ${d.name||'device'}`);
}

function updateStatus(m,e=0){const s=document.getElementById('status');s.textContent=m;s.style.color=e?'#f44':'inherit';}
function sendCmd(cmd){return c?c.writeValue(cmd):Promise.reject();}
function setColor(r,g,b){color={r,g,b};return sendCmd(new Uint8Array([0x7e,0,5,3,r,g,b,0,0xef]));}
function setBrightness(v){return sendCmd(new Uint8Array([0x7e,0,1,v,0,0,0,0,0xef]));}

function togglePower(){
    const p=document.getElementById('powerBtn'),o=p.classList.contains('on');
    sendCmd(new Uint8Array([0x7e,0,4,o?0:1,0,0,0,0xef])).then(()=>{
        p.textContent=o?'Power On':'Power Off';
        p.classList.toggle('on');
        if(!o) setColor(color.r,color.g,color.b);
    });
}

document.getElementById('color-triangle').addEventListener('click',e=>{
    const t=e.target.getBoundingClientRect(),x=e.clientX-t.left,y=e.clientY-t.top;
    const r=Math.min(255,Math.max(0,510-(x/y)*510)),b=Math.min(255,Math.max(0,510-((200-x)/y)*510));
    setColor(r,255-r-b,b);
});

document.getElementById('brightness').addEventListener('input',e=>setBrightness(e.target.value));
</script>
</body>
</html>
