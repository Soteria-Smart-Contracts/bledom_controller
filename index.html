<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BLEDOM</title>
    <style>
        body{background:#0a192f;color:#e6f1ff;font-family:sans-serif;text-align:center;margin:20px;}
        #color-triangle{width:400px;height:346px;margin:10px auto;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(to bottom right,red 0%,#0f0 50%,blue 100%);}
        #brightness{width:400px;margin:10px auto;accent-color:#3b82f6;}
        button{padding:12px 24px;font-size:16px;border:none;border-radius:6px;cursor:pointer;margin:5px;}
        #connectBtn{background:#3b82f6;color:white;}
        #powerBtn{background:#444;color:white;}
        #powerBtn.on{background:#3b82f6;box-shadow:0 0 15px #3b82f6;}
    </style>
</head>
<body>
    <div id="nosupport" style="display:none"><h1>No Bluetooth</h1><p>Enable in chrome://flags</p></div>
    <div id="interface" style="display:none">
        <h1>BLEDOM</h1>
        <div id="status">Click Connect</div>
        <button id="connectBtn" onclick="C()">Connect</button>
        <div id="controls" style="display:none">
            <button id="powerBtn" onmouseover="P(0)" onmouseout="P(1)" onclick="T()">Power Off</button>
            <div id="color-triangle" onmousemove="S(event)"></div>
            <input type="range" id="brightness" min="0" max="100" value="100" oninput="B(this.value)">
        </div>
    </div>

<script>
let d=null,c=null,clr={r:255,g:255,b:255},p=1,oL=1;
window.onload=()=>navigator.bluetooth?document.getElementById('interface').style.display='block':document.getElementById('nosupport').style.display='block';

async function C(){
    try{
        d=await navigator.bluetooth.requestDevice({acceptAllDevices:1,optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']});
        d.addEventListener('gattserverdisconnected',_=>document.getElementById('connectBtn').style.display='block');
        let s=await d.gatt.connect(),v=await s.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb');
        c=await v.getCharacteristic('0000fff3-0000-1000-8000-00805f9b34fb');
        document.getElementById('connectBtn').style.display='none';
        document.getElementById('controls').style.display='block';
    }catch(e){document.getElementById('status').textContent=e;}
}

function X(cmd){return c?c.writeValue(cmd):0;}
function S(e){
    let t=e.target.getBoundingClientRect(),x=e.clientX-t.left,y=e.clientY-t.top;
    let r=Math.min(255,x/t.width*510),b=Math.min(255,(t.height-y)/t.height*510),g=255-Math.max(r,b);
    X(new Uint8Array([0x7e,0,5,3,r,g,b,0,0xef]));
}

function B(v){X(new Uint8Array([0x7e,0,1,v,0,0,0,0,0xef]));}

function P(s){
    if(s===p)return;
    X(new Uint8Array([0x7e,0,4,s,0,0,0,0xef]));
    if(s)X(new Uint8Array([0x7e,0,5,3,clr.r,clr.g,clr.b,0,0xef]));
    if(!oL)p=s;
}

function T(){
    oL=!oL;
    let b=document.getElementById('powerBtn');
    b.textContent=oL?'Power Off':'Power On';
    b.classList.toggle('on');
    p=oL;
}
</script>
</body>
</html>
